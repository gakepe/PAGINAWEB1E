<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Gerenciador de Bebidas (updated)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; margin: 0; padding: 0; }
    body { font-family: Arial,sans-serif; background:linear-gradient(135deg,#182848 0%,#2980b9 100%); color:#f0f0f0; margin:0; padding:0; }
    #btnUndo { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:2999; background:linear-gradient(90deg,#4CAF50 0%,#45a049 100%); color:#fff; padding:10px 20px; font-size:14px; border:none; border-radius:10px; cursor:pointer; box-shadow:0 2px 12px #0005; font-weight:700; transition:background .2s,transform .1s; }
    #btnUndo:hover:not(:disabled) { background:linear-gradient(90deg,#388E3C 0%,#2E7D32 100%); transform:translateX(-50%) scale(1.04); }
    #btnUndo:disabled { background:#ccc; cursor:not-allowed; opacity:0.5; }
    #espacoVazio { height:1600px; width:100%; }
    #container { width:100%; max-width:100%; margin:20px 0; background:rgba(30,30,30,0.92); border-radius: 12px; box-shadow:0 2px 20px #0005; padding: 14px; }
    h2 { text-align:center; color:#64b5f6; margin-top:0; margin-bottom:14px; }
    .lista-section { width:100%; background:rgba(0,0,0,0.3); border-radius:10px; padding:12px; min-height:350px; }
    .lista-section h3 { color:#64b5f6; border-bottom:2px solid #64b5f6; padding-bottom:8px; font-size:18px; margin-top:0; margin-bottom:10px; }
    table { width:100%; border-collapse:collapse; background:#1e1e1e; margin-top:8px; font-size:13px;}
    th,td { border:1px solid #333; padding:8px; text-align:left; color:#f0f0f0; word-wrap: break-word; overflow-wrap: break-word;}
    th { background:#2980b9; color:#fff; font-weight:bold; font-size:13px;}
    input, select, textarea { width:100%; padding:10px; font-size:16px; margin-bottom:8px; border:2px solid #64b5f6; border-radius:4px; background:#121212; color:white; box-sizing:border-box; }
    input:focus, select:focus, textarea:focus { border-color:#2980b9; outline:none;}
    button { background: linear-gradient(90deg,#2196f3 0%,#64b5f6 100%); color:#fff; padding:11px 16px; font-size:14px; border:none; border-radius:6px; cursor:pointer; margin-bottom:8px; font-weight:600; transition:background .2s,transform .1s; }
    button:hover { background:linear-gradient(90deg,#1976d2 0%,#2980b9 100%);}
    .btn-group { text-align:center; margin-bottom:12px; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; width:100%; }
    .btn-group button { margin:0; flex:1; min-width:90px; padding:11px 12px; font-size:13px; }
    .btn-group select { padding:10px 10px; font-size:14px; margin:0; flex:1; min-width:90px; }
    .popup {
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
      width:90vw;
      max-width:500px;
      background:#232a34;
      padding:20px;
      border-radius: 12px;
      box-shadow:0 2px 30px #0008;
      z-index:3001;
      display:none;
      max-height:80vh;
      overflow-y:auto;
      box-sizing: border-box;
    }
    .popup h3 { color:#64b5f6; margin-top:0; margin-bottom:16px; font-size:18px; }
    .popup label { color: #fff; font-weight: 600; display: block; margin-bottom: 6px; font-size:13px;}
    .popup input, .popup select { margin-bottom:14px; font-size:16px; padding:12px;}
    .popup button { margin-right:0; margin-bottom:8px; width:100%; font-size:15px; padding:14px;}
    #overlay { position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0008;display:none;z-index:3000; }
    #aviso {width:100%; margin:16px 0 0 0; padding:12px 16px; background:rgba(30,30,30,0.96); border-radius:10px; text-align:center; font-size:13px; box-shadow:0 2px 10px #0003;}
    .red-btn { background: linear-gradient(135deg,#d32f2f 0%,#b71c1c 100%) !important; color: #fff !important; border: none; }
    .red-btn:hover { background: linear-gradient(135deg,#c62828 0%,#b71c1c 100%) !important;}
    .green-btn { background: linear-gradient(135deg,#4CAF50 0%,#45a049 100%) !important; color: #fff !important; border: none; }
    .green-btn:hover { background: linear-gradient(135deg,#388E3C 0%,#2E7D32 100%) !important;}
    .purple-btn { background: linear-gradient(135deg,#9b27b0 0%,#af40bf 100%) !important; color: #fff !important; border: none; }
    .purple-btn:hover { background: linear-gradient(135deg,#7a1884 0%,#922a9e 100%) !important;}
    .trash-btn {
      background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%) !important;
      color: #fff !important;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 14px;
      padding: 0;
      cursor:pointer;
      line-height: 32px;
      text-align:center;
      vertical-align: middle;
    }
    .trash-btn:hover { background: linear-gradient(135deg, #b71c1c 0%, #7d0909 100%) !important; }
    .inline { display:inline-block; margin-right:6px; margin-bottom:0; }
    @media (max-width:768px){ .popup { width: 95vw; max-width: 95vw; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div id="aviso">
    <b>Bem-vindo ao Gerenciador de Bebidas! 🍷</b> Organize o estoque e as compras.
  </div>
  
  <div id="container">
    <div style="margin-bottom:10px;">
      <button id="btnUndo" disabled>↶ Desfazer (Ctrl+Z)</button>
    </div>

    <div class="btn-group">
      <button id="btnAddBebida" class="green-btn">➕ Adicionar</button>
      <button id="btnExportar">📥 Exportar</button>
      <button id="btnImportar">📤 Importar</button>
      <input id="importar" type="file" accept=".json" style="display:none">
      <button id="btnPNG">🖼️ PNG</button>
      <!-- PDF button removed as requested -->
      <button id="btnTotal" class="purple-btn">💰 Total</button>
      <button id="btnApagarTudo" class="red-btn">🗑️ Apagar</button>
    </div>

    <div class="btn-group selector-tabview">
      <select id="abaSeletor">
        <option value="estoque">Estoque</option>
        <option value="compra">Compras</option>
      </select>
    </div>

    <div class="lista-section" id="listaSection">
      <h3 id="tituloLista">📦 Estoque</h3>
      <table id="tabela">
        <thead id="thead-estoque">
          <tr>
            <th>Bebida</th>
            <th style="width:50px;">Qtd</th>
            <th style="width:120px;">Ação</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  
  <div id="espacoVazio"></div>
  <div id="overlay"></div>

  <!-- POPUP ADICIONAR BEBIDA - ESTOQUE -->
  <div class="popup" id="popup-addEstoque">
    <h3>➕ Adicionar ao Estoque</h3>
    <label>Nome da bebida:</label>
    <input type="text" id="nomeEstoque" placeholder="Ex: Coca-Cola 2L">
    <label>Quantidade:</label>
    <input type="number" id="qtdEstoque" placeholder="Ex: 10" value="1" min="1">
    <button id="popupAddEstoqueBtn" class="green-btn" type="button">Adicionar</button>
    <button class="popupCancelBtn" type="button">Cancelar</button>
  </div>

  <!-- POPUP ADICIONAR BEBIDA - COMPRAS -->
  <div class="popup" id="popup-addCompra">
    <h3>➕ Adicionar para Comprar</h3>
    <label>Nome da bebida:</label>
    <input type="text" id="nomeCompra" placeholder="Ex: Coca-Cola 2L">
    <label>Quantidade:</label>
    <input type="number" id="qtdCompra" placeholder="Ex: 50" value="1" min="1" step="0.01">
    <label>Preço (R$):</label>
    <input type="number" id="precoCompra" placeholder="Ex: 1.50" step="0.01" min="0">
    <label id="labelTotalCompra" style="color: #4CAF50; font-size: 14px;">Total: R$ 0,00</label>
    <button id="popupAddCompraBtn" class="green-btn" type="button">Adicionar</button>
    <button class="popupCancelBtn" type="button">Cancelar</button>
  </div>

  <!-- POPUP EDITAR BEBIDA -->
  <div class="popup" id="popup-editarBebida">
    <h3>✏️ Editar</h3>
    <label>Nome da bebida:</label>
    <input type="text" id="editNome" placeholder="Ex: Coca-Cola 2L">
    <label id="editLabelQtd">Quantidade:</label>
    <input type="number" id="editQtd" placeholder="Ex: 10" value="1" min="1" step="0.01">
    <div id="editDadosExtra" style="display:none;">
      <label>Preço (R$):</label>
      <input type="number" id="editPreco" placeholder="Ex: 1.50" step="0.01" min="0">
      <label id="editLabelTotal" style="color: #4CAF50; font-size: 14px;">Total: R$ 0,00</label>
    </div>
    <button id="popupEditarBebidaBtn" class="green-btn" type="button">Salvar</button>
    <button class="popupCancelBtn" type="button">Cancelar</button>
  </div>

  <!-- POPUP JUNTAR BEBIDA -->
  <div class="popup" id="popup-juntarBebida">
    <h3>🔗 Similar encontrada</h3>
    <p id="msgJuntar" style="color:#64b5f6; margin-bottom:16px; font-size:14px;"></p>
    <button id="btnConfirmarJuntar" class="green-btn" type="button">✓ Juntar</button>
    <button id="btnNaoJuntar" type="button">✗ Adicionar Separado</button>
  </div>

  <!-- POPUP TOTAL -->
  <div class="popup" id="popup-total">
    <h3 style="text-align:center;">💰 Total de Compras</h3>
    <div style="background: rgba(76, 175, 80, 0.2); border: 2px solid #4CAF50; border-radius: 8px; padding: 16px; text-align: center; margin-bottom: 16px;">
      <p style="font-size: 14px; color: #aaa; margin: 0 0 8px 0;">Total da lista:</p>
      <p id="valorTotalCompra" style="font-size: 28px; color: #4CAF50; font-weight: 700; margin: 0;">R$ 0,00</p>
    </div>
    <button class="popupCancelBtn" type="button">Fechar</button>
  </div>

  <script>
    let bebidas = { estoque: [], compra: [] };
    let historicoAcoes = [];
    let abaAtual = 'estoque';
    let bebidaEditandoIndex = -1;
    let bebidaEditandoTipo = '';
    let bebidaPendenteMover = null;

    document.addEventListener("DOMContentLoaded", () => {
      carregarDados();
      desenharTabela();

      document.querySelectorAll('.popupCancelBtn').forEach(btn => btn.addEventListener('click', fecharPopup));
      document.getElementById("btnUndo").addEventListener('click', desfazer);
      document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); desfazer(); } });

      document.getElementById("abaSeletor").addEventListener('change', trocarAba);
      document.getElementById("btnAddBebida").addEventListener('click', () => abrirPopup(abaAtual === 'estoque' ? 'addEstoque' : 'addCompra'));

      document.getElementById("popupAddEstoqueBtn").addEventListener('click', addEstoque);
      document.getElementById("popupAddCompraBtn").addEventListener('click', addCompra);
      document.getElementById("popupEditarBebidaBtn").addEventListener('click', salvarEdicaoBebida);

      document.getElementById("btnConfirmarJuntar").addEventListener('click', confirmarJuntar);
      document.getElementById("btnNaoJuntar").addEventListener('click', naoJuntar);

      document.getElementById("btnTotal").addEventListener('click', mostrarTotal);

      document.getElementById("btnExportar").addEventListener('click', exportarDados);
      document.getElementById("btnImportar").addEventListener('click', () => document.getElementById('importar').click());
      document.getElementById("importar").addEventListener('change', importarDados);
      document.getElementById("btnPNG").addEventListener('click', exportarPNG);
      // PDF intentionally removed per request

      document.getElementById("btnApagarTudo").addEventListener('click', apagarTudo);

      document.getElementById("qtdCompra").addEventListener('input', atualizarTotalCompra);
      document.getElementById("precoCompra").addEventListener('input', atualizarTotalCompra);

      document.getElementById("editQtd").addEventListener('input', atualizarTotalEdit);
      document.getElementById("editPreco").addEventListener('input', atualizarTotalEdit);

      document.getElementById('overlay').addEventListener('click', fecharPopup);
    });

    // --- Utilities and UI helpers ---
    function salvarAcao(descricao) {
      historicoAcoes.push({ descricao, estado: JSON.parse(JSON.stringify(bebidas)) });
      atualizarBtnUndo();
    }
    function atualizarBtnUndo() { document.getElementById("btnUndo").disabled = historicoAcoes.length === 0; }
    function desfazer() {
      if (!historicoAcoes.length) { alert("Nenhuma ação para desfazer!"); return; }
      bebidas = historicoAcoes.pop().estado;
      desenharTabela(); salvarDados(); atualizarBtnUndo();
    }

    function trocarAba() { abaAtual = document.getElementById('abaSeletor').value; desenharTabela(); }

    function abrirPopup(tipo) {
      document.getElementById('overlay').style.display = 'block';
      document.querySelectorAll('.popup').forEach(p => p.style.display = 'none');
      const popup = document.getElementById('popup-' + tipo);
      if (!popup) return;
      popup.style.display = 'block';

      if (tipo === 'addEstoque') { document.getElementById('nomeEstoque').value = ''; document.getElementById('qtdEstoque').value = '1'; setTimeout(()=>document.getElementById('nomeEstoque').focus(),100); }
      if (tipo === 'addCompra')  { document.getElementById('nomeCompra').value = ''; document.getElementById('qtdCompra').value = '1'; document.getElementById('precoCompra').value = ''; atualizarTotalCompra(); setTimeout(()=>document.getElementById('nomeCompra').focus(),100); }
    }
    function fecharPopup() { document.getElementById('overlay').style.display = 'none'; document.querySelectorAll('.popup').forEach(p => p.style.display = 'none'); }

    // --- Data persistence ---
    function salvarDados(){ localStorage.setItem('gerenciadorBebidas', JSON.stringify(bebidas)); }
    function carregarDados(){
      try {
        const dados = localStorage.getItem('gerenciadorBebidas');
        bebidas = dados ? JSON.parse(dados) : { estoque:[], compra:[] };
      } catch (e) { console.error(e); bebidas = { estoque:[], compra:[] }; }
    }

    // --- Add functions ---
    function addEstoque(){
      const nome = document.getElementById('nomeEstoque').value.trim();
      const qtd = parseFloat(document.getElementById('qtdEstoque').value) || 1;
      if (!nome) return alert("Nome da bebida é obrigatório!");
      salvarAcao(`Adicionar "${nome}" ao estoque`);
      bebidas.estoque.push({ nome, qtd });
      desenharTabela(); salvarDados(); fecharPopup();
    }

    function addCompra(){
      const nome = document.getElementById('nomeCompra').value.trim();
      const qtd = parseFloat(document.getElementById('qtdCompra').value) || 1;
      const preco = parseFloat(document.getElementById('precoCompra').value) || 0;
      if (!nome) return alert("Nome da bebida é obrigatório!");
      if (preco <= 0) return alert("Preço deve ser maior que 0!");
      salvarAcao(`Adicionar "${nome}" para comprar`);
      bebidas.compra.push({ nome, qtd, preco, total: qtd * preco });
      desenharTabela(); salvarDados(); fecharPopup();
    }

    function atualizarTotalCompra(){
      const qtd = parseFloat(document.getElementById('qtdCompra').value) || 0;
      const preco = parseFloat(document.getElementById('precoCompra').value) || 0;
      document.getElementById('labelTotalCompra').textContent = `Total: R$ ${ (qtd*preco).toFixed(2).replace('.',',') }`;
    }
    function atualizarTotalEdit(){
      const qtd = parseFloat(document.getElementById('editQtd').value) || 0;
      const preco = parseFloat(document.getElementById('editPreco').value) || 0;
      document.getElementById('editLabelTotal').textContent = `Total: R$ ${ (qtd*preco).toFixed(2).replace('.',',') }`;
    }

    // --- Edit / Remove / Move (use event listeners created dynamically) ---
    function editarBebida(index){
      bebidaEditandoTipo = abaAtual;
      bebidaEditandoIndex = index;
      const bebida = bebidas[abaAtual][index];
      document.getElementById('editNome').value = bebida.nome || '';
      document.getElementById('editQtd').value = bebida.qtd || 1;
      if (abaAtual === 'compra') {
        document.getElementById('editDadosExtra').style.display = 'block';
        document.getElementById('editPreco').value = bebida.preco || '';
        atualizarTotalEdit();
      } else {
        document.getElementById('editDadosExtra').style.display = 'none';
      }
      abrirPopup('editarBebida');
    }

    function salvarEdicaoBebida(){
      const nome = document.getElementById('editNome').value.trim();
      const qtd = parseFloat(document.getElementById('editQtd').value) || 1;
      if (!nome) return alert("Nome da bebida é obrigatório!");
      salvarAcao(`Editar "${nome}"`);
      if (bebidaEditandoTipo === 'estoque') {
        bebidas.estoque[bebidaEditandoIndex] = { nome, qtd };
      } else {
        const preco = parseFloat(document.getElementById('editPreco').value) || 0;
        if (preco <= 0) return alert("Preço deve ser maior que 0!");
        bebidas.compra[bebidaEditandoIndex] = { nome, qtd, preco, total: qtd * preco };
      }
      desenharTabela(); salvarDados(); fecharPopup();
    }

    function removerBebida(index){
      const nome = bebidas[abaAtual][index]?.nome || '';
      if (!confirm(`Remover "${nome}"?`)) return;
      salvarAcao(`Remover "${nome}"`);
      bebidas[abaAtual].splice(index,1);
      desenharTabela(); salvarDados();
    }

    function moverParaEstoque(index){
      const bebidaCompra = bebidas.compra[index];
      if (!bebidaCompra) return;
      // find similar
      const similar = bebidas.estoque.findIndex(b => calcularSimilaridade(b.nome, bebidaCompra.nome) > 0.75);
      if (similar !== -1) {
        bebidaPendenteMover = { compraIndex: index, estoqueIndex: similar };
        document.getElementById('msgJuntar').textContent = `Similar: "${bebidas.estoque[similar].nome}"\n\nJuntar "${bebidaCompra.nome}"?`;
        abrirPopup('juntarBebida');
        return;
      }
      if (!confirm(`Marcar "${bebidaCompra.nome}" como comprado?`)) return;
      salvarAcao(`Marcar "${bebidaCompra.nome}" como comprado`);
      bebidas.estoque.push({ nome: bebidaCompra.nome, qtd: bebidaCompra.qtd });
      bebidas.compra.splice(index,1);
      desenharTabela(); salvarDados();
    }

    function confirmarJuntar(){
      const { compraIndex, estoqueIndex } = bebidaPendenteMover || {};
      if (compraIndex == null || estoqueIndex == null) return fecharPopup();
      const compra = bebidas.compra[compraIndex];
      bebidas.estoque[estoqueIndex].qtd += compra.qtd;
      bebidas.compra.splice(compraIndex,1);
      salvarAcao(`Juntar "${compra.nome}"`);
      abaAtual = 'estoque';
      document.getElementById('abaSeletor').value = 'estoque';
      desenharTabela(); salvarDados(); fecharPopup();
    }
    function naoJuntar(){
      const { compraIndex } = bebidaPendenteMover || {};
      if (compraIndex == null) return fecharPopup();
      const compra = bebidas.compra[compraIndex];
      bebidas.estoque.push({ nome: compra.nome, qtd: compra.qtd });
      bebidas.compra.splice(compraIndex,1);
      salvarAcao(`Marcar "${compra.nome}" como comprado`);
      abaAtual = 'estoque';
      document.getElementById('abaSeletor').value = 'estoque';
      desenharTabela(); salvarDados(); fecharPopup();
    }

    // --- Draw table (create buttons with event listeners to avoid inline onclick issues) ---
    function desenharTabela(){
      const lista = bebidas[abaAtual];
      const tbody = document.querySelector("#tabela tbody");
      const titulo = document.getElementById('tituloLista');
      const thead = document.getElementById('thead-estoque');

      if (abaAtual === 'estoque') {
        titulo.textContent = '📦 Estoque';
        thead.innerHTML = `<tr><th>Bebida</th><th style="width:50px;">Qtd</th><th style="width:120px;">Ação</th></tr>`;
      } else {
        titulo.textContent = '🛒 Compras';
        thead.innerHTML = `<tr><th>Bebida</th><th style="width:40px;">Qtd</th><th style="width:55px;">Preço</th><th style="width:60px;">Total</th><th style="width:120px;">Ação</th></tr>`;
      }

      tbody.innerHTML = '';

      lista.forEach((bebida, index) => {
        const tr = document.createElement('tr');

        // name cell
        const tdNome = document.createElement('td');
        tdNome.textContent = bebida.nome;
        tr.appendChild(tdNome);

        // qty cell
        const tdQtd = document.createElement('td');
        tdQtd.textContent = (bebida.qtd !== undefined ? bebida.qtd : '') + 'x';
        tr.appendChild(tdQtd);

        if (abaAtual === 'compra') {
          const tdPreco = document.createElement('td');
          tdPreco.style.textAlign = 'center';
          tdPreco.textContent = (bebida.preco !== undefined) ? `R$ ${bebida.preco.toFixed(2).replace('.',',')}` : '';
          tr.appendChild(tdPreco);

          const tdTotal = document.createElement('td');
          tdTotal.style.textAlign = 'center';
          tdTotal.style.fontWeight = '600';
          tdTotal.style.color = '#4CAF50';
          tdTotal.textContent = (bebida.total !== undefined) ? `R$ ${bebida.total.toFixed(2).replace('.',',')}` : '';
          tr.appendChild(tdTotal);
        }

        // actions cell
        const tdAcoes = document.createElement('td');
        tdAcoes.style.textAlign = 'center';
        tdAcoes.style.whiteSpace = 'nowrap';

        // edit button
        const btnEdit = document.createElement('button');
        btnEdit.textContent = '✏️';
        btnEdit.style.cssText = 'background:linear-gradient(90deg,#2196f3 0%,#64b5f6 100%); color:#fff; border:none; padding:6px 8px; border-radius:4px; cursor:pointer; font-size:12px; margin:2px; font-weight:600;';
        btnEdit.addEventListener('click', () => editarBebida(index));
        tdAcoes.appendChild(btnEdit);

        // If on purchases, add "move to estoque" button
        if (abaAtual === 'compra') {
          const btnMove = document.createElement('button');
          btnMove.textContent = '✓';
          btnMove.style.cssText = 'background:linear-gradient(90deg,#4CAF50 0%,#45a049 100%); color:#fff; border:none; padding:6px 8px; border-radius:4px; cursor:pointer; font-size:12px; margin:2px; font-weight:600;';
          btnMove.addEventListener('click', () => moverParaEstoque(index));
          tdAcoes.appendChild(btnMove);
        }

        // delete/trash button
        const btnTrash = document.createElement('button');
        btnTrash.className = 'trash-btn';
        btnTrash.title = 'Remover';
        btnTrash.textContent = '🗑️';
        btnTrash.style.margin = '2px';
        btnTrash.addEventListener('click', () => removerBebida(index));
        tdAcoes.appendChild(btnTrash);

        tr.appendChild(tdAcoes);
        tbody.appendChild(tr);
      });
    }

    // --- Export / Import ---
    function exportarDados() {
      if (!confirm("Deseja exportar os dados?")) return;
      const blob = new Blob([JSON.stringify(bebidas, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `bebidas-${new Date().toISOString().split('T')[0]}.json`;
      link.click();
    }

    function importarDados(e){
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const dados = JSON.parse(reader.result);
          if (!dados.estoque || !dados.compra) throw "Formato inválido";
          salvarAcao("Importar dados");
          bebidas = dados;
          desenharTabela(); salvarDados(); alert("Dados importados!");
        } catch { alert("Erro ao importar."); }
      };
      reader.readAsText(file);
    }

    // --- PNG export (improved checks and restore) ---
    async function exportarPNG(){
      if (!window.html2canvas) { alert("html2canvas não está disponível. Verifique a conexão ou carregamento do script."); return; }
      const lista = bebidas[abaAtual];
      if (!lista.length) { alert("A lista está vazia!"); return; }

      const chunkSize = 15;
      const chunks = [];
      for (let i = 0; i < lista.length; i += chunkSize) chunks.push(lista.slice(i, i + chunkSize));

      const tbody = document.querySelector("#tabela tbody");
      const origTHead = document.querySelector("#tabela thead").innerHTML;
      const origTBody = tbody.innerHTML;

      for (let idx = 0; idx < chunks.length; idx++) {
        // render chunk in table
        const headerHTML = (abaAtual === 'estoque')
          ? `<tr><th>Bebida</th><th style="width:50px;">Qtd</th></tr>`
          : `<tr><th>Bebida</th><th style="width:40px;">Qtd</th><th style="width:55px;">Preço</th><th style="width:60px;">Total</th></tr>`;
        document.querySelector("#tabela thead").innerHTML = headerHTML;
        tbody.innerHTML = '';
        chunks[idx].forEach(bebida => {
          const tr = document.createElement('tr');
          if (abaAtual === 'estoque') {
            tr.innerHTML = `<td>${bebida.nome}</td><td>${bebida.qtd}x</td>`;
          } else {
            tr.innerHTML = `<td>${bebida.nome}</td><td>${bebida.qtd}x</td><td>${(bebida.preco||0).toFixed(2).replace('.',',')}</td><td>${(bebida.total||0).toFixed(2).replace('.',',')}</td>`;
          }
          tbody.appendChild(tr);
        });

        // wait a tick for layout
        await new Promise(r => setTimeout(r, 200));

        try {
          const canvas = await html2canvas(document.getElementById('tabela'), { scale: 3, backgroundColor: '#1e1e1e', useCORS: true });
          const link = document.createElement('a');
          link.download = `bebidas-${abaAtual}-${idx+1}de${chunks.length}.png`;
          link.href = canvas.toDataURL();
          link.click();
        } catch (err) {
          alert("Erro ao gerar PNG: " + (err && err.message ? err.message : err));
          break;
        }
      }

      // restore table
      document.querySelector("#tabela thead").innerHTML = origTHead;
      tbody.innerHTML = origTBody;
      desenharTabela();
    }

    // --- Total modal ---
    function mostrarTotal(){
      if (abaAtual === 'estoque') { alert("Total disponível apenas para a lista de compras!"); return; }
      const totalGeral = bebidas.compra.reduce((s,b) => s + (b.total||0), 0);
      document.getElementById('valorTotalCompra').textContent = `R$ ${totalGeral.toFixed(2).replace('.',',')}`;
      abrirPopup('total');
    }

    // --- Clear all ---
    function apagarTudo() {
      if (!confirm("Apagar tudo?")) return;
      if (!confirm("Tem certeza? Não pode desfazer!")) return;
      bebidas = { estoque: [], compra: [] };
      historicoAcoes = [];
      desenharTabela(); salvarDados(); atualizarBtnUndo();
    }

    // --- Similarity helpers (unchanged) ---
    function calcularSimilaridade(str1, str2) {
      let s1 = String(str1||'').toLowerCase().trim();
      let s2 = String(str2||'').toLowerCase().trim();
      s1 = s1.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      s2 = s2.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (s1 === s2) return 1.0;
      let s1Clean = s1.replace(/[0-9,.\-l]/g, '').trim();
      let s2Clean = s2.replace(/[0-9,.\-l]/g, '').trim();
      if (s1Clean === s2Clean && s1Clean.length > 0) return 0.98;
      let longer = s1.length > s2.length ? s1 : s2;
      let shorter = s1.length > s2.length ? s2 : s1;
      if (longer.length === 0) return 1.0;
      let editDistance = levenshtein(longer, shorter);
      return 1.0 - (editDistance / longer.length);
    }
    function levenshtein(a, b) {
      if (a.length < b.length) { let tmp=a; a=b; b=tmp; }
      let v0 = Array.from({length: b.length+1}, (_,i)=>i);
      for (let i=1;i<=a.length;i++){
        let v1 = [i];
        for (let j=1;j<=b.length;j++){
          let cost = a[i-1] === b[j-1] ? 0 : 1;
          v1[j] = Math.min(v1[j-1]+1, v0[j]+1, v0[j-1]+cost);
        }
        v0 = v1;
      }
      return v0[b.length];
    }
