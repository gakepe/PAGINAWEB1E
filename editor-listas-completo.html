<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Product Editor</h1>
    </header>
    
    <main>
        <section id="product-list">
            <h2>Product List</h2>
            <ul id="products">
                <!-- Product items will be populated here -->
            </ul>
            <button onclick="exportPDF()">Export as PDF</button>
        </section>

        <section id="controls">
            <button onclick="undo()">Undo</button>
            <button onclick="renameProduct()">Rename Product</button>
            <button onclick="autoOrderProducts()">Auto-Order Products</button>
            <button onclick="replaceProduct()">Replace Product</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Product Editor</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
